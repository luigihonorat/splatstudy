[package]
name = "splatstudy-native"
description = "SplatStudy on the desktop: the SDL3 shell around splatstudy-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "splatstudy"
path = "src/main.rs"

[dependencies]
splatstudy-core.workspace = true
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
log.workspace = true
pollster.workspace = true
# SDL3 for pen pressure on every desktop OS; built from source (needs CMake).
sdl3 = { version = "0.21", features = ["raw-window-handle", "build-from-source-static"] }
wgpu = { workspace = true, features = ["dx12", "vulkan", "metal"] }
# Downloading the gallery's casts from the web app: rustls with ring,
# trusting the OS's root certificates (no OpenSSL anywhere).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider"] }

# The window icon on macOS and Linux, decoded from assets/icon.png.
[target.'cfg(not(windows))'.dependencies]
png.workspace = true

# The icon built into the Windows .exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
