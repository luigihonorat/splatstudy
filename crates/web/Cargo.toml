[package]
name = "splatstudy-web"
description = "SplatStudy in the browser: the WebGPU shell around splatstudy-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
splatstudy-core.workspace = true
console_error_panic_hook = "0.1"
console_log = "1"
egui-wgpu = { workspace = true, features = ["fragile-send-sync-non-atomic-wasm"] }
js-sys = "0.3"
log.workspace = true
# Pinned to the wasm-bindgen CLI used by xtask; web-sys and js-sys follow it.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "Blob",
    "BlobPropertyBag",
    "CompositionEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FocusEvent",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Navigator",
    "Performance",
    "PointerEvent",
    "Response",
    "Storage",
    "Url",
    "WheelEvent",
    "Window",
] }
wgpu = { workspace = true, features = ["webgpu", "fragile-send-sync-non-atomic-wasm"] }
