# cargo deny check licenses
#
# Every dependency must be under a licence that also allows distribution
# through app stores; otherwise the app store exception in LICENSE-EXCEPTION
# could not be used. No GPL, LGPL or AGPL crates.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# Our own crates (publish = false) carry the GPL with the exception.
ignore = true
