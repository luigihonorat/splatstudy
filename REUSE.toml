version = 1
SPDX-PackageName = "splatstudy"
SPDX-PackageDownloadLocation = "https://github.com/luigihonorat/splatstudy"

# Project files that cannot carry a comment header.
[[annotations]]
path = [
    "**/Cargo.toml",
    "Cargo.lock",
    ".cargo/config.toml",
    ".claude/settings.json",
    ".gitattributes",
    ".gitignore",
    ".github/**",
    "*.md",
    "REUSE.toml",
    "deny.toml",
    "about.toml",
    "about.hbs",
    "web/**",
    "crates/native/assets/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The SplatStudy contributors"
SPDX-License-Identifier = "GPL-3.0-or-later WITH LicenseRef-SplatStudy-app-store-exception"

[[annotations]]
path = ["crates/core/assets/fonts/Barlow-*.ttf", "crates/core/assets/fonts/OFL-Barlow.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2017 The Barlow Project Authors (https://github.com/jpt/barlow)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["crates/core/assets/fonts/NotoSansJP-UI.ttf", "crates/core/assets/fonts/OFL-NotoSansJP.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2014-2021 Adobe (http://www.adobe.com/), with Reserved Font Name 'Source'"
SPDX-License-Identifier = "OFL-1.1"

# Bundled sample references: plaster casts from the Royal Cast Collection,
# scanned and released into the public domain by SMK. Converted from SMK's
# STL to binary PLY, stood upright (Z up to Y up); nothing else changed.
[[annotations]]
path = "web/samples/*.ply"
precedence = "override"
SPDX-FileCopyrightText = "SMK – National Gallery of Denmark (Statens Museum for Kunst), The Royal Cast Collection"
SPDX-License-Identifier = "CC0-1.0"
