[package]
name = "xtask"
description = "Build tasks for SplatStudy: cargo xtask web | serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Same version as the wasm-bindgen crate in crates/web, so the generated JS
# always matches the wasm.
wasm-bindgen-cli-support = "=0.2.129"
